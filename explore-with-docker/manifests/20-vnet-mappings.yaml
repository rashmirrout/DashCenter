# VnetMappings — overlay→underlay rewrites for a handful of overlay IPs in each VNet.
# action=vnet_encap means encapsulate to the listed underlay_ip + mac_address.
apiVersion: dashcenter.v1
kind: VnetMapping
metadata:
  name: map-app-10
  namespace: default
  labels: { tier: app }
spec:
  vnet_name: vnet-app
  ip_address: "10.10.0.10"
  underlay_ip: "10.0.5.11"
  mac_address: "00:11:22:00:00:01"
  action: "vnet_encap"
---
