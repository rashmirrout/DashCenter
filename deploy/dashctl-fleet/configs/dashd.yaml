# dashd configuration for the dashctl-fleet (5-DPU + CLI demo).
#
# Same shape as deploy/dashd-fleet/configs/dashd.yaml; mounted at
# /etc/dashd/dashd.yaml inside the dashd container.

listen:
  rest_addr:  ":8443"
  grpc_addr:  ":9443"
  admin_addr: ":7443"

storage:
  backend: file
  file:
    state_dir: /var/lib/dashd

inventory:
  source: file
  file:   /etc/dashd/inventory.yaml

reconcile:
  tick_interval:        15s
  per_dpu_inbox_size:   1
  apply_rate_limit:     100
  error_budget_per_min: 10

log:
  level:  info
  format: json
