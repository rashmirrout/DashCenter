# dashd configuration for the single-DPU end-to-end demo.
#
# This is the simplest possible dashd setup: one control plane managing
# one simulated DPU. Mounted into the dashd container at
# /etc/dashd/dashd.yaml.

listen:
  rest_addr:  ":8443"
  grpc_addr:  ":9443"
  admin_addr: ":7443"

storage:
  backend: file
  file:
    # Backed by the `dashd-state-e2e` named Docker volume.
    state_dir: /var/lib/dashd

inventory:
  # Static, single-DPU inventory — see ./inventory.yaml.
  source: file
  file:   /etc/dashd/inventory.yaml

reconcile:
  # Shorter tick than the fleet config so e2e.sh observes convergence quickly
  # without needing to POST /v1/reconcile.
  tick_interval:        5s
  per_dpu_inbox_size:   1
  apply_rate_limit:     100
  error_budget_per_min: 10

log:
  level:  info
  format: json