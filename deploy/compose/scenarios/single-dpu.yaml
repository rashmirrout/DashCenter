# dash-sim startup scenario: one DPU with a small VNET and a couple of ENIs.
apiVersion: dashsim.dashcenter.io/v1
kind: Scenario
metadata:
  name: single-dpu
  device_id: dpu-sim-01
spec:
  vnets:
    - id: vnet-prod
      vni: 1001
  enis:
    - id: eni-100
      vnet: vnet-prod
      mac: "00:aa:bb:00:01:00"
      addresses: ["10.0.0.4/24"]
    - id: eni-101
      vnet: vnet-prod
      mac: "00:aa:bb:00:01:01"
      addresses: ["10.0.0.5/24"]
  acl_groups:
    - id: acl-default
      stage: inbound
      rules:
        - num: 10
          action: allow
          src: "10.0.0.0/24"
          dst: "0.0.0.0/0"
