# ECMP demo: media stream load-balanced across retail + bank web.
apiVersion: dashcenter.v1
kind: RoutePolicy
metadata: { name: rp-media-stream-ecmp, labels: { tenant: media } }
spec:
  eni_names: [eni-media-stream-01, eni-media-stream-02, eni-media-stream-03, eni-media-stream-04]
  routes:
    - { prefix: 192.168.31.0/24, next_hop_type: vnet, next_hop_target: media-stream, metric: 10 }
    - prefix: 10.100.0.0/16
      ecmp_members:
        - { next_hop_type: vnet, next_hop_target: retail-prod-web, weight: 50 }
        - { next_hop_type: vnet, next_hop_target: bank-prod-web,   weight: 50 }
      metric: 20
    - { prefix: 0.0.0.0/0, next_hop_type: service_tunnel, next_hop_target: st-internet-egress, metric: 100 }
---
