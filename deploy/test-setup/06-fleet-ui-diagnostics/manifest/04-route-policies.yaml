# ===== NEW in 05: gaming routes =====
---
# Gaming lobby: internet access via DDoS scrub, cross-region peering for matchmaking.
apiVersion: dashcenter.v1
kind: RoutePolicy
metadata: { name: rp-gaming-lobby, labels: { tenant: gaming } }
spec:
  eni_names: [eni-gaming-lobby-01, eni-gaming-lobby-02, eni-gaming-lobby-03, eni-gaming-lobby-04]
  routes:
    - { prefix: 192.168.61.0/24, next_hop_type: vnet,           next_hop_target: gaming-lobby, metric: 10 }
    - { prefix: 192.168.62.0/24, next_hop_type: vnet,           next_hop_target: gaming-match, metric: 10 }
    - { prefix: 10.128.0.0/16,   next_hop_type: service_tunnel, next_hop_target: st-cross-region, metric: 20 }
    - { prefix: 0.0.0.0/0,       next_hop_type: service_tunnel, next_hop_target: st-ddos-scrub,   metric: 100 }
---
# Gaming match: isolated — only lobby + cross-region, else drop.
apiVersion: dashcenter.v1
kind: RoutePolicy
metadata: { name: rp-gaming-match, labels: { tenant: gaming } }
spec:
  eni_names: [eni-gaming-match-01, eni-gaming-match-02, eni-gaming-match-03, eni-gaming-match-04]
  routes:
    - { prefix: 192.168.62.0/24, next_hop_type: vnet,           next_hop_target: gaming-match, metric: 10 }
    - { prefix: 192.168.61.0/24, next_hop_type: vnet,           next_hop_target: gaming-lobby, metric: 20 }
    - prefix: 10.128.0.0/16
      ecmp_members:
        - { next_hop_type: service_tunnel, next_hop_target: st-cross-region, weight: 70 }
        - { next_hop_type: service_tunnel, next_hop_target: st-ddos-scrub,   weight: 30 }
      metric: 30
    - { prefix: 0.0.0.0/0, next_hop_type: drop, metric: 1000 }
---
# Gaming ECMP: lobby spreads traffic across lobby + match for geo load balance.
apiVersion: dashcenter.v1
kind: RoutePolicy
metadata: { name: rp-gaming-geo-lb, labels: { tenant: gaming, class: ecmp } }
spec:
  eni_names: [eni-gaming-lobby-01, eni-gaming-lobby-02]
  routes:
    - prefix: 10.200.0.0/16
      ecmp_members:
        - { next_hop_type: vnet, next_hop_target: gaming-lobby, weight: 40 }
        - { next_hop_type: vnet, next_hop_target: gaming-match, weight: 40 }
        - { next_hop_type: service_tunnel, next_hop_target: st-cross-region, weight: 20 }
      metric: 15