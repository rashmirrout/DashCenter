# 04-route-policies.yaml — 15 RoutePolicies (superset of 04-ha).
# Covers: vnet next-hop, service_tunnel next-hop, drop, ECMP fan-out,
# DDoS scrub (gaming), cross-region peering, and per-tenant defaults.

apiVersion: dashcenter.v1
kind: RoutePolicy
metadata: { name: rp-bank-web-default, labels: { tenant: bank } }
spec:
  eni_names: [eni-bank-web-01, eni-bank-web-02, eni-bank-web-03, eni-bank-web-04]
  routes:
    - { prefix: 192.168.11.0/24, next_hop_type: vnet,           next_hop_target: bank-prod-web,    metric: 10 }
    - { prefix: 192.168.12.0/24, next_hop_type: vnet,           next_hop_target: bank-prod-db,     metric: 10 }
    - { prefix: 0.0.0.0/0,       next_hop_type: service_tunnel, next_hop_target: st-internet-egress, metric: 100 }
---
apiVersion: dashcenter.v1
kind: RoutePolicy
metadata: { name: rp-bank-db-default, labels: { tenant: bank } }
spec:
