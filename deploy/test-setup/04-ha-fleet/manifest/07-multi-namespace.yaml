# 07-multi-namespace.yaml — second tenant namespace `edge`, proving cross-
# namespace isolation. All specs carry `metadata.namespace: edge`. dashd
# will reject any cross-namespace reference (e.g. an ENI in `edge`
# pointing at a Vnet in `default`) at admission time.
#
# Try after apply:
#   dashctl --endpoint http://127.0.0.1:28443 -A get vnet
#   dashctl --endpoint http://127.0.0.1:28443 -n edge get eni
#   dashctl --endpoint http://127.0.0.1:28443 -n default get eni edge-cdn-01
#     → 404 (the same name lives only in `edge`)

apiVersion: dashcenter.v1
kind: Vnet
metadata: { name: cdn-pop, namespace: edge, labels: { tenant: edge-cdn, env: prod } }
spec: { vni: 2001 }
---
apiVersion: dashcenter.v1
kind: Vnet
metadata: { name: cdn-origin, namespace: edge, labels: { tenant: edge-cdn, env: prod } }
spec: { vni: 2002 }
---
# ENIs in the `edge` namespace, both referencing the `edge`-local Vnet.
apiVersion: dashcenter.v1
kind: Eni
metadata: { name: edge-cdn-01, namespace: edge, labels: { tenant: edge-cdn } }
spec:
  namespace: edge
  vnet_name: cdn-pop
  mac_address: aa:bb:cc:f0:00:01
  underlay_ip: 10.20.1.11
  admin_state: up
  placement_hint_dpu_ids: [dpu-sim-04]
---
apiVersion: dashcenter.v1
kind: Eni
metadata: { name: edge-cdn-02, namespace: edge, labels: { tenant: edge-cdn } }
spec:
  namespace: edge
  vnet_name: cdn-pop
  mac_address: aa:bb:cc:f0:00:02
  underlay_ip: 10.20.1.12
  admin_state: up
  placement_hint_dpu_ids: [dpu-sim-05]
---
apiVersion: dashcenter.v1
kind: Eni
metadata: { name: edge-origin-01, namespace: edge, labels: { tenant: edge-cdn } }
spec:
  namespace: edge
  vnet_name: cdn-origin
  mac_address: aa:bb:cc:f0:00:03
  underlay_ip: 10.20.2.11
  admin_state: up
  placement_hint_dpu_ids: [dpu-sim-04]
---
apiVersion: dashcenter.v1
kind: VnetMapping
metadata: { name: map-edge-pop-11, namespace: edge }
spec:
  namespace: edge
  vnet_name: cdn-pop
  ip_address: 192.168.201.11
  underlay_ip: 10.20.1.11
  mac_address: aa:bb:cc:f0:00:01
  action: vnet_encap
---
apiVersion: dashcenter.v1
kind: VnetMapping
metadata: { name: map-edge-pop-12, namespace: edge }
spec:
  namespace: edge
  vnet_name: cdn-pop
  ip_address: 192.168.201.12
  underlay_ip: 10.20.1.12
  mac_address: aa:bb:cc:f0:00:02
  action: vnet_encap
---
apiVersion: dashcenter.v1
kind: VnetMapping
metadata: { name: map-edge-origin-11, namespace: edge }
spec:
  namespace: edge
  vnet_name: cdn-origin
  ip_address: 192.168.202.11
  underlay_ip: 10.20.2.11
  mac_address: aa:bb:cc:f0:00:03
  action: vnet_encap
---
# RoutePolicy bound to edge ENIs only.
apiVersion: dashcenter.v1
kind: RoutePolicy
metadata: { name: rp-edge-cdn-default, namespace: edge, labels: { tenant: edge-cdn } }
spec:
  namespace: edge
  eni_names: [edge-cdn-01, edge-cdn-02]
  routes:
    - { prefix: 192.168.201.0/24, next_hop_type: vnet, next_hop_target: cdn-pop,    metric: 10 }
    - { prefix: 192.168.202.0/24, next_hop_type: vnet, next_hop_target: cdn-origin, metric: 20 }
    - { prefix: 0.0.0.0/0,        next_hop_type: drop,                              metric: 1000 }
---
# Tight ACL on the edge ENIs — public HTTPS only, no SSH, allow_and_continue
# chains into an internal cache rule.
apiVersion: dashcenter.v1
kind: AclPolicy
metadata: { name: acl-edge-cdn-inbound, namespace: edge }
spec:
  namespace: edge
  stage: inbound
  eni_names: [edge-cdn-01, edge-cdn-02]
  rules:
    - { priority: 100, action: allow,              src_prefixes: [0.0.0.0/0],    dst_ports: ["443"], protocols: [tcp], description: "public https" }
    - { priority: 110, action: allow_and_continue, src_prefixes: [10.255.0.0/16], protocols: [icmp],                   description: "ops icmp continues into next stage" }
    - { priority: 120, action: allow,              src_prefixes: [10.20.2.0/24], dst_ports: ["6379"], protocols: [tcp], description: "redis cache fetch" }
    - { priority: 130, action: deny,               src_prefixes: [0.0.0.0/0],    dst_ports: ["22","23","3389"], protocols: [tcp], description: "no remote shell" }
    - { priority: 1000, action: deny,              src_prefixes: [0.0.0.0/0],                                          description: "catch-all" }
