# 04-route-policies.yaml — 12 RoutePolicies covering every route shape:
# vnet next-hop, service_tunnel next-hop, drop, ECMP fan-out, and per-tenant
# default routes.

apiVersion: dashcenter.v1
kind: RoutePolicy
metadata: { name: rp-bank-web-default, labels: { tenant: bank } }
spec:
  eni_names: [eni-bank-web-01, eni-bank-web-02, eni-bank-web-03, eni-bank-web-04]
  routes:
    - { prefix: 192.168.11.0/24, next_hop_type: vnet,           next_hop_target: bank-prod-web,    metric: 10 }
    - { prefix: 192.168.12.0/24, next_hop_type: vnet,           next_hop_target: bank-prod-db,     metric: 10 }
    - { prefix: 0.0.0.0/0,       next_hop_type: service_tunnel, next_hop_target: st-internet-egress, metric: 100 }
---
apiVersion: dashcenter.v1
kind: RoutePolicy
metadata: { name: rp-bank-db-default, labels: { tenant: bank } }
spec:
  eni_names: [eni-bank-db-01, eni-bank-db-02]
  routes:
    - { prefix: 192.168.12.0/24, next_hop_type: vnet,           next_hop_target: bank-prod-db, metric: 10 }
    - { prefix: 192.168.11.0/24, next_hop_type: vnet,           next_hop_target: bank-prod-web, metric: 20 }
    - { prefix: 10.0.255.30/32,  next_hop_type: service_tunnel, next_hop_target: st-privatelink-azuredb, metric: 5 }
    - { prefix: 0.0.0.0/0,       next_hop_type: drop,           metric: 1000 }
---
