# 05-acl-policies.yaml — 12 ACL policies, 120 rules total.
# Coverage: inbound + outbound stages, allow/deny/allow_and_continue actions,
# IPv4 prefixes, single ports + port ranges, tcp/udp/icmp protocols.

# 1) bank-web inbound — 10 rules
apiVersion: dashcenter.v1
kind: AclPolicy
metadata: { name: acl-bank-web-inbound, labels: { tenant: bank, tier: web } }
spec:
  stage: inbound
  eni_names: [eni-bank-web-01, eni-bank-web-02, eni-bank-web-03, eni-bank-web-04]
  rules:
    - { priority: 100, action: allow, src_prefixes: [0.0.0.0/0],          dst_ports: ["443"],  protocols: [tcp], description: "https from internet" }
    - { priority: 110, action: allow, src_prefixes: [203.0.113.0/24],     dst_ports: ["80"],   protocols: [tcp], description: "http from cdn" }
    - { priority: 120, action: allow, src_prefixes: [192.168.12.0/24],    dst_ports: ["3306","5432"], protocols: [tcp], description: "db reply traffic" }
    - { priority: 130, action: allow, src_prefixes: [192.168.91.0/24],    dst_ports: ["443"],  protocols: [tcp], description: "via shared ingress" }
    - { priority: 140, action: deny,  src_prefixes: [10.0.0.0/8],         dst_ports: ["22","23"], protocols: [tcp], description: "no mgmt from rfc1918" }
    - { priority: 150, action: deny,  src_prefixes: [0.0.0.0/0],          dst_ports: ["22","23","3389"], protocols: [tcp], description: "no remote shell" }
    - { priority: 160, action: allow_and_continue, src_prefixes: [198.51.100.0/24], protocols: [icmp], description: "icmp from monitoring" }
    - { priority: 170, action: deny,  src_prefixes: [0.0.0.0/0],          protocols: [icmp], description: "no other icmp" }
    - { priority: 180, action: allow, src_prefixes: [10.255.0.0/16],      dst_ports: ["9100"], protocols: [tcp], description: "prom node-exporter" }
    - { priority: 1000, action: deny, src_prefixes: [0.0.0.0/0],          description: "catch-all deny" }
---
# 2) bank-web outbound — 8 rules
apiVersion: dashcenter.v1
kind: AclPolicy
metadata: { name: acl-bank-web-outbound, labels: { tenant: bank, tier: web } }
spec:
  stage: outbound
  eni_names: [eni-bank-web-01, eni-bank-web-02, eni-bank-web-03, eni-bank-web-04]
  rules:
    - { priority: 100, action: allow, dst_prefixes: [192.168.12.0/24], dst_ports: ["3306","5432"], protocols: [tcp], description: "to bank db" }
    - { priority: 110, action: allow, dst_prefixes: [0.0.0.0/0],       dst_ports: ["443"], protocols: [tcp], description: "outbound https" }
    - { priority: 120, action: allow, dst_prefixes: [0.0.0.0/0],       dst_ports: ["53"],  protocols: [udp,tcp], description: "dns" }
    - { priority: 130, action: allow, dst_prefixes: [10.255.0.0/16],   dst_ports: ["9100"], protocols: [tcp], description: "prom scrape return" }
    - { priority: 140, action: allow, dst_prefixes: [192.168.91.0/24], dst_ports: ["443"], protocols: [tcp], description: "to shared ingress" }
    - { priority: 150, action: deny,  dst_prefixes: [192.168.21.0/24], description: "no retail traffic" }
    - { priority: 160, action: deny,  dst_prefixes: [192.168.31.0/24], description: "no media traffic" }
    - { priority: 1000, action: deny, dst_prefixes: [0.0.0.0/0],       description: "catch-all egress deny" }
---
