# 01-service-tunnels.yaml — 4 service tunnels: internet egress (NAT),
# shared NSG, PrivateLink to managed DB, corp VPN.

apiVersion: dashcenter.v1
kind: ServiceTunnel
metadata: { name: st-internet-egress, labels: { class: nat, scope: fleet } }
spec:
  local_underlay_ip:  10.255.0.10
  remote_underlay_ip: 198.51.100.10
  vni: 8001
  params:
    action: nat
    nat_pool: 203.0.113.0/26
    snat_persist_seconds: "300"
---
apiVersion: dashcenter.v1
kind: ServiceTunnel
metadata: { name: st-nsg-shared, labels: { class: nsg } }
spec:
  local_underlay_ip:  10.255.0.20
  remote_underlay_ip: 10.255.1.20
  vni: 8002
  params:
    action: inspect
    chain: shared-nsg-default
---
apiVersion: dashcenter.v1
kind: ServiceTunnel
metadata: { name: st-privatelink-azuredb, labels: { class: privatelink, target: azuredb } }
spec:
  local_underlay_ip:  10.255.0.30
  remote_underlay_ip: 10.0.255.30
  vni: 8003
  params:
    action: privatelink
    target_fqdn: db.privatelink.example.com
---
apiVersion: dashcenter.v1
kind: ServiceTunnel
metadata: { name: st-vpn-corp, labels: { class: vpn, target: corp-hq } }
spec:
  local_underlay_ip:  10.255.0.40
  remote_underlay_ip: 192.0.2.40
  vni: 8004
  params:
    action: ipsec
    ike_group: "14"
