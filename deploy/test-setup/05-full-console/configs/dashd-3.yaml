# dashd-3 config — controller mode with etcd-elected HA.
mode: controller
node_id: dashd-3

listen:
  rest_addr:  ":8443"
  grpc_addr:  ":9443"
  admin_addr: ":7443"

storage:
  backend: etcd
  etcd:
    endpoints: ["http://etcd:2379"]
    key_prefix: /dashd/console/state/
    dial_timeout: 5s

inventory:
  source: file
  file:   /etc/dashd/inventory.yaml

ha:
  controller:
    elector:
      backend: etcd
      endpoints: ["http://etcd:2379"]
      leader_key: /dashd/console/leader
      lease_ttl: 8s
      dial_timeout: 5s

reconcile:
  tick_interval:        5s
  per_dpu_inbox_size:   1
  apply_rate_limit:     100
  error_budget_per_min: 10

log:
  level:  info
  format: json
