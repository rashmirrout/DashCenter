# dashd-2 config — controller mode with etcd elector.
listen:
  rest_addr:  ":8443"
  grpc_addr:  ":9443"
  admin_addr: ":7443"

storage:
  backend: etcd
  etcd:
    endpoints: ["etcd:2379"]
    prefix: /dashd/console/state/

inventory:
  source: file
  file:   /etc/dashd/inventory.yaml

ha:
  mode: controller
  etcd:
    endpoints: ["etcd:2379"]
    prefix: /dashd/console/leader/
    node_id: dashd-2
    lease_ttl: 8s

reconcile:
  tick_interval:        30s
  per_dpu_inbox_size:   1
  apply_rate_limit:     100
  error_budget_per_min: 10

log:
  level:  info
  format: json