# 00-vnets.yaml — 14 tenant + shared-services VNets (superset of 04-ha).
#
# Tenants: bank, retail, media, iot, analytics, gaming + shared pair.
# Each tenant has two VNets (web/db, stream/control, etc.).
# Gaming is new in 05 — exercises DPUs 08-10.

apiVersion: dashcenter.v1
kind: Vnet
metadata: { name: bank-prod-web, labels: { tenant: bank, tier: web, env: prod } }
spec: { vni: 1001 }
