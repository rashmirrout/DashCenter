# DashCenter — Full Experiment: 50 DPU sims + 3 HA dashd + 2-node etcd cluster + Web Console
#
# This is the at-scale topology for experiments and stress testing.
# 50 simulated DPUs across 25 appliances (2 DPUs per appliance),
# 3 HA controllers with etcd-elected leadership, 2-node etcd cluster
# for redundancy, and the dashw web console.
#
# ONE COMMAND:
#   docker compose up -d --build
#
# THEN OPEN:
#   http://localhost:3000
#
# TEAR DOWN:
#   docker compose down -v

name: dashcenter-experiment

networks:
  dc-exp-net:
    driver: bridge

volumes:
  etcd-data-1:
  etcd-data-2:

services:

  # ── 2-node etcd cluster (redundant state store) ────────────────
  etcd-1:
    image: quay.io/coreos/etcd:v3.5.18
    container_name: dc-exp-etcd-1
    command:
      - etcd
      - --name=etcd-1
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd-1:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd-1:2380
      - --initial-cluster=etcd-1=http://etcd-1:2380,etcd-2=http://etcd-2:2380
      - --initial-cluster-state=new
    volumes:
      - etcd-data-1:/etcd-data
    networks: [dc-exp-net]
    ports: ["12379:2379"]
    healthcheck:
      test: ["CMD", "etcdctl", "--endpoints=http://127.0.0.1:2379", "endpoint", "health"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  etcd-2:
    image: quay.io/coreos/etcd:v3.5.18
    container_name: dc-exp-etcd-2
    command:
      - etcd
      - --name=etcd-2
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd-2:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd-2:2380
      - --initial-cluster=etcd-1=http://etcd-1:2380,etcd-2=http://etcd-2:2380
      - --initial-cluster-state=new
    volumes:
      - etcd-data-2:/etcd-data
    networks: [dc-exp-net]
    ports: ["12380:2379"]
    healthcheck:
      test: ["CMD", "etcdctl", "--endpoints=http://127.0.0.1:2379", "endpoint", "health"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

