    restart: unless-stopped

  dashd-2:
    build: { context: ../../.., dockerfile: src/impl-go/dashd/Dockerfile }
    image: dashcenter/dashd:dev
    container_name: dc-exp-dashd-2
    depends_on:
      etcd-1: { condition: service_healthy }
      etcd-2: { condition: service_healthy }
      dash-sim-01: { condition: service_started }
      dash-sim-50: { condition: service_started }
    volumes:
      - ./configs/dashd-2.yaml:/etc/dashd/dashd.yaml:ro
      - ./configs/inventory.yaml:/etc/dashd/inventory.yaml:ro
    networks: [dc-exp-net]
    ports:
      - "28453:8443"
      - "29453:9443"
      - "27453:7443"
    restart: unless-stopped

  dashd-3:
    build: { context: ../../.., dockerfile: src/impl-go/dashd/Dockerfile }
    image: dashcenter/dashd:dev
    container_name: dc-exp-dashd-3
    depends_on:
      etcd-1: { condition: service_healthy }
      etcd-2: { condition: service_healthy }
      dash-sim-01: { condition: service_started }
      dash-sim-50: { condition: service_started }
    volumes:
      - ./configs/dashd-3.yaml:/etc/dashd/dashd.yaml:ro
      - ./configs/inventory.yaml:/etc/dashd/inventory.yaml:ro
    networks: [dc-exp-net]
    ports:
      - "28463:8443"
      - "29463:9443"
      - "27463:7443"
    restart: unless-stopped

  # ── Web Console (BFF + SPA) ─────────────────────────────────────
  dashw:
    build: { context: ../../.., dockerfile: src/impl-go/console/Dockerfile }
    image: dashcenter/dashw:dev
    container_name: dc-exp-dashw
    depends_on:
      dashd-1: { condition: service_started }
      dashd-2: { condition: service_started }
      dashd-3: { condition: service_started }
    environment:
      DASHD_REST_ADDR: http://dashd-1:8443
      DASHD_GRPC_ADDR: dashd-1:9443
      DASHD_ADMIN_ADDR: http://dashd-1:7443
      DASHD_CLUSTER_ADDRS: "http://dashd-1:7443,http://dashd-2:7443,http://dashd-3:7443"
      DASHW_LISTEN: ":3000"
      DASHW_CORS: "true"
      DASHW_LOG_LEVEL: info
    networks: [dc-exp-net]
    ports:
      - "3000:3000"
    restart: unless-stopped

  # ── One-shot CLI (optional) ─────────────────────────────────────
  dashctl:
    build: { context: ../../.., dockerfile: src/impl-go/dashctl/Dockerfile }
    image: dashcenter/dashctl:dev
    profiles: [cli]
    networks: [dc-exp-net]
    volumes:
      - ./manifest:/etc/dashd/manifest:ro
    entrypoint:
      - dashctl
      - --endpoint
      - http://dashd-1:8443
      - --admin-endpoint
      - http://dashd-1:7443
      - --insecure
    environment:
      DASHCTL_ENDPOINT: http://dashd-1:8443
      DASHCTL_ADMIN_ENDPOINT: http://dashd-1:7443
      DASHCTL_INSECURE: "true"
