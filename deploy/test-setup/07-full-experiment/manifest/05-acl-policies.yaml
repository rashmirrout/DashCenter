# 05-acl-policies.yaml - 32 AclPolicies
# 10 tenant-in + 10 tenant-out + 2 platform + 5 tier-specific + 5 staging-restricted
#
# NOTE: AclRule match fields are REPEATED (plural) in the dashcenter.v1
# schema: `src_prefixes: []`, `dst_prefixes: []`, `src_ports: []`,
# `dst_ports: []`, `protocols: []`. The singular scalar forms
# (`src_prefix`, `dst_port`, `protocol`) are NOT part of the schema and
# are silently dropped by dashd's JSON decoder — leaving rules with only
# `priority` + `action`. Always use the plural array forms below.
---
apiVersion: dashcenter.v1
kind: AclPolicy
metadata: { name: acl-bank-inbound, labels: { tenant: bank, direction: inbound } }
spec:
  stage: inbound
  priority: 100
  eni_names: [eni-bank-web-01, eni-bank-api-01, eni-bank-db-01, eni-bank-cache-01, eni-bank-worker-01]
  rules:
    - { priority: 100, action: allow, src_prefixes: ["10.0.0.0/8"], dst_ports: ["443"], protocols: [tcp] }
    - { priority: 200, action: allow, src_prefixes: ["10.0.0.0/8"], dst_ports: ["22"], protocols: [tcp] }
    - { priority: 300, action: allow, protocols: [icmp] }
    - { priority: 400, action: allow, src_prefixes: ["10.10.0.0/16"], dst_ports: ["9090"], protocols: [tcp] }
    - { priority: 1000, action: deny }
