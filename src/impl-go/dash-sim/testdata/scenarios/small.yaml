# Small DASH scenario, using upstream sonic-dash-api types verbatim.
# Each value follows protojson rules: enums by their full name (e.g.
# STATE_ENABLED), bytes as base64 strings, fixed32 IpAddress as numeric
# network-order ints.
apiVersion: dashapi.dashcenter.io/v1
kind: Scenario
metadata:
  name: small
  device_id: dpu-sim-01
spec:
  # Appliance: one per DPU. sip = 10.0.0.1 (network byte order in fixed32 = 16777226 hex 0x0100000a) — encode as the int form.
  - kind: appliance
    key: ["appliance-01"]
    value:
      sip:
        ipv4: 16777226           # 10.0.0.1 in network-byte-order fixed32
      vm_vni: 1000
      local_region_id: 1

  # Two VNETs.
  - kind: vnet
    key: ["vnet-prod"]
    value:
      vni: 1001
  - kind: vnet
    key: ["vnet-stage"]
    value:
      vni: 1002

  # Two ENIs anchored to vnet-prod.
  - kind: eni
    key: ["eni-001"]
    value:
      eni_id: "11111111-1111-1111-1111-111111111111"
      mac_address: "ABEiM0RV"     # base64("00:11:22:33:44:55" bytes)
      vnet: "vnet-prod"
      admin_state: STATE_ENABLED
  - kind: eni
    key: ["eni-002"]
    value:
      eni_id: "22222222-2222-2222-2222-222222222222"
      mac_address: "ABEiM0RW"
      vnet: "vnet-prod"
      admin_state: STATE_ENABLED

  # An ACL group + a single permit rule + bind it to ENI inbound stage 1.
  - kind: acl_group
    key: ["acl-prod-in"]
    value:
      ip_version: IP_VERSION_IPV4
  - kind: acl_rule
    key: ["acl-prod-in", "100"]
    value:
      priority: 100
      action: ACTION_PERMIT
      terminating: true
  - kind: acl_in
    key: ["eni-001", "1"]
    value:
      v4_acl_group_id: "acl-prod-in"

  # A vnet -> overlay/underlay mapping.
  - kind: vnet_mapping
    key: ["vnet-prod", "10.0.0.20"]
    value:
      underlay_ip:
        ipv4: 343798372            # 100.64.0.20 in network-byte-order fixed32
      mac_address: "AKqrzN3u"
      routing_type: ROUTING_TYPE_VNET

  # A route_group + a route inside it that targets vnet-stage.
  - kind: route_group
    key: ["rg-prod"]
    value:
      version: "v1"
  - kind: route
    key: ["rg-prod", "10.1.0.0/16"]
    value:
      routing_type: ROUTING_TYPE_VNET
      vnet: "vnet-stage"

  # Bind ENI -> route group.
  - kind: eni_route
    key: ["eni-001"]
    value:
      group_id: "rg-prod"
