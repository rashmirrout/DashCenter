version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/rashmirrout/DashCenter/src/impl-go/gen/go
plugins:
  - remote: buf.build/protocolbuffers/go
    out: ../../gen/go
    opt:
      - paths=source_relative
  - remote: buf.build/grpc/go
    out: ../../gen/go
    opt:
      - paths=source_relative
      - require_unimplemented_servers=false
inputs:
  - directory: ../../../proto
