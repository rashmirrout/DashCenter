// dashsim.proto — DASH simulator gRPC API (self-contained v0.1).
//
// v0.1 design choice: this file defines its OWN message types for the DASH
// objects we exercise (Vnet, Eni, AclGroup, AclRule, Route, VnetMapping).
// Once `scripts/vendor-protos.{ps1,sh}` has populated proto/vendor/sonic-dash-api/,
// these definitions will be replaced by `import` statements that pull in the
// upstream types verbatim. Until then we keep things self-contained so the
// whole stack builds with zero external proto deps.

syntax = "proto3";

package dashsim.v1;

option go_package = "github.com/rashmirrout/DashCenter/src/impl-go/gen/go/dashsim/v1;dashsimv1";

// -----------------------------------------------------------------------------
// Object kinds
// -----------------------------------------------------------------------------

enum ObjectKind {
  OBJECT_KIND_UNSPECIFIED  = 0;
  OBJECT_KIND_VNET         = 1;
  OBJECT_KIND_ENI          = 2;
  OBJECT_KIND_VNET_MAPPING = 3;
  OBJECT_KIND_ROUTE        = 4;
  OBJECT_KIND_ACL_GROUP    = 5;
  OBJECT_KIND_ACL_RULE     = 6;
}

enum EventType {
  EVENT_TYPE_UNSPECIFIED = 0;
  EVENT_TYPE_CREATED     = 1;
  EVENT_TYPE_UPDATED     = 2;
  EVENT_TYPE_DELETED     = 3;
  EVENT_TYPE_SNAPSHOT    = 4;
}

enum AclStage {
  ACL_STAGE_UNSPECIFIED = 0;
  ACL_STAGE_INBOUND     = 1;
  ACL_STAGE_OUTBOUND    = 2;
}

enum AclAction {
  ACL_ACTION_UNSPECIFIED = 0;
  ACL_ACTION_ALLOW       = 1;
  ACL_ACTION_DENY        = 2;
}

enum RouteAction {
  ROUTE_ACTION_UNSPECIFIED = 0;
  ROUTE_ACTION_FORWARD     = 1;
  ROUTE_ACTION_DROP        = 2;
  ROUTE_ACTION_ENCAP       = 3;
}

// -----------------------------------------------------------------------------
// Object messages
// -----------------------------------------------------------------------------

message Vnet {
  string id  = 1;
  uint32 vni = 2;
  map<string, string> labels = 3;
  int64  created_ts_ns = 4;
  int64  updated_ts_ns = 5;
}

message Eni {
  string   id        = 1;
  string   vnet_id   = 2;
  string   mac       = 3;
  repeated string addresses = 4;
  string   admin_state = 5;
  uint64   bandwidth_min_bps = 6;
  uint64   bandwidth_max_bps = 7;
  map<string, string> labels = 8;
  int64    created_ts_ns = 9;
  int64    updated_ts_ns = 10;
}

message VnetMapping {
  string id          = 1;
  string vnet_id     = 2;
  string overlay_ip  = 3;
  string underlay_ip = 4;
  string mac         = 5;
  uint32 vni         = 6;
  int64  created_ts_ns = 7;
}

message Route {
  string      id            = 1;
  string      table         = 2;
  string      dst_prefix    = 3;
  RouteAction action        = 4;
  string      next_hop_ip   = 5;
  string      vnet_id       = 6;
  int64       created_ts_ns = 7;
}

message AclGroup {
  string   id            = 1;
  AclStage stage         = 2;
  int64    created_ts_ns = 3;
}

message AclRule {
  string    id            = 1;
  string    group_id      = 2;
  uint32    num           = 3;
  AclAction action        = 4;
  string    src_prefix    = 5;
  string    dst_prefix    = 6;
  string    protocol      = 7;
  uint32    src_port      = 8;
  uint32    dst_port      = 9;
  int64     created_ts_ns = 10;
}

// -----------------------------------------------------------------------------
// Envelopes
// -----------------------------------------------------------------------------

message Ack {
  string txn_id       = 1;
  bool   accepted     = 2;
  string error        = 3;
  int64  server_ts_ns = 4;
}

message KeyRequest { string id = 1; }

message ListRequest {
  string filter = 1;
  int32  limit  = 2;
  string cursor = 3;
}

message VnetResponse        { Vnet        item = 1; int64 server_ts_ns = 2; }
message EniResponse         { Eni         item = 1; int64 server_ts_ns = 2; }
message VnetMappingResponse { VnetMapping item = 1; int64 server_ts_ns = 2; }
message RouteResponse       { Route       item = 1; int64 server_ts_ns = 2; }
message AclGroupResponse    { AclGroup    item = 1; int64 server_ts_ns = 2; }
message AclRuleResponse     { AclRule     item = 1; int64 server_ts_ns = 2; }

message SubscribeRequest {
  repeated ObjectKind kinds = 1;
  bool snapshot_first       = 2;
}

message Event {
  string     txn_id        = 1;
  EventType  type          = 2;
  ObjectKind kind          = 3;
  string     id            = 4;
  oneof payload {
    Vnet        vnet         = 10;
    Eni         eni          = 11;
    VnetMapping vnet_mapping = 12;
    Route       route        = 13;
    AclGroup    acl_group    = 14;
    AclRule     acl_rule     = 15;
  }
  int64 server_ts_ns = 20;
}

message CountersResponse {
  map<string, int64> counters = 1;
  int64 server_ts_ns          = 2;
}

// -----------------------------------------------------------------------------
// Service
// -----------------------------------------------------------------------------

service DashSim {
  rpc CreateVnet (Vnet)        returns (Ack);
  rpc DeleteVnet (KeyRequest)  returns (Ack);
  rpc GetVnet    (KeyRequest)  returns (VnetResponse);
  rpc ListVnets  (ListRequest) returns (stream VnetResponse);

  rpc CreateEni (Eni)         returns (Ack);
  rpc UpdateEni (Eni)         returns (Ack);
  rpc DeleteEni (KeyRequest)  returns (Ack);
  rpc GetEni    (KeyRequest)  returns (EniResponse);
  rpc ListEnis  (ListRequest) returns (stream EniResponse);

  rpc AddVnetMapping    (VnetMapping) returns (Ack);
  rpc DeleteVnetMapping (KeyRequest)  returns (Ack);
  rpc ListVnetMappings  (ListRequest) returns (stream VnetMappingResponse);

  rpc AddRoute    (Route)       returns (Ack);
  rpc DeleteRoute (KeyRequest)  returns (Ack);
  rpc ListRoutes  (ListRequest) returns (stream RouteResponse);

  rpc AddAclGroup    (AclGroup)    returns (Ack);
  rpc DeleteAclGroup (KeyRequest)  returns (Ack);
  rpc ListAclGroups  (ListRequest) returns (stream AclGroupResponse);
  rpc AddAclRule     (AclRule)     returns (Ack);
  rpc DeleteAclRule  (KeyRequest)  returns (Ack);
  rpc ListAclRules   (ListRequest) returns (stream AclRuleResponse);

  rpc Subscribe (SubscribeRequest) returns (stream Event);

  rpc GetCounters (KeyRequest) returns (CountersResponse);
}
